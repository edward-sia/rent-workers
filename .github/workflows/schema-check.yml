name: schema-check

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - id: check
        env:
          AIRTABLE_TOKEN: ${{ secrets.AIRTABLE_TOKEN }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: npm run --silent check:schema -- --github-actions >/dev/null 2>&1
      - name: Report schema check
        if: ${{ !cancelled() && (steps.check.outcome == 'success' || steps.check.outcome == 'failure') }}
        env:
          SUMMARY: ${{ steps.check.outputs.summary || 'Schema check could not complete.' }}
          OUTCOME: ${{ steps.check.outcome }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          printf '%s\n' "$SUMMARY"
          if [ "$OUTCOME" = failure ]; then
            jq -n --arg content "$SUMMARY" '{content: $content}' |
              curl --fail --silent --output /dev/null \
                -H 'Content-Type: application/json' --data-binary @- "$DISCORD_WEBHOOK_URL"
          fi
