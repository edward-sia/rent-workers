name: deploy-production

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: Type deploy-production to confirm a production deploy from main.
        required: true
        type: string

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
    steps:
      - name: Guard production deploy
        run: |
          test "${{ github.ref }}" = "refs/heads/main"
          test "${{ inputs.confirm }}" = "deploy-production"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm run test
      - run: npm run build
      - run: npm run build:production
      - name: Deploy charge-generator production
        run: npm run deploy --workspace charge-generator -- --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Deploy payment-bot production
        run: npm run deploy --workspace payment-worker -- --env=""
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Configure production Telegram webhook
        env:
          PRODUCTION_PAYMENT_BOT_URL: ${{ vars.PRODUCTION_PAYMENT_BOT_URL }}
          PRODUCTION_TELEGRAM_BOT_TOKEN: ${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}
          PRODUCTION_TELEGRAM_WEBHOOK_SECRET: ${{ secrets.PRODUCTION_TELEGRAM_WEBHOOK_SECRET }}
        run: |
          test -n "$PRODUCTION_PAYMENT_BOT_URL"
          test -n "$PRODUCTION_TELEGRAM_BOT_TOKEN"
          test -n "$PRODUCTION_TELEGRAM_WEBHOOK_SECRET"
          payload="$(jq -n \
            --arg url "$PRODUCTION_PAYMENT_BOT_URL" \
            --arg secret "$PRODUCTION_TELEGRAM_WEBHOOK_SECRET" \
            '{url: $url, secret_token: $secret, drop_pending_updates: false, allowed_updates: ["message", "callback_query"]}')"
          curl --fail --silent --show-error \
            -H "Content-Type: application/json" \
            -d "$payload" \
            "https://api.telegram.org/bot${PRODUCTION_TELEGRAM_BOT_TOKEN}/setWebhook"
      - name: Smoke test production workers
        env:
          PRODUCTION_CHARGE_GENERATOR_URL: ${{ vars.PRODUCTION_CHARGE_GENERATOR_URL }}
          PRODUCTION_PAYMENT_BOT_URL: ${{ vars.PRODUCTION_PAYMENT_BOT_URL }}
          PRODUCTION_CF_ACCESS_CLIENT_ID: ${{ secrets.PRODUCTION_CF_ACCESS_CLIENT_ID }}
          PRODUCTION_CF_ACCESS_CLIENT_SECRET: ${{ secrets.PRODUCTION_CF_ACCESS_CLIENT_SECRET }}
        run: |
          test -n "$PRODUCTION_CHARGE_GENERATOR_URL"
          test -n "$PRODUCTION_PAYMENT_BOT_URL"
          test -n "$PRODUCTION_CF_ACCESS_CLIENT_ID"
          test -n "$PRODUCTION_CF_ACCESS_CLIENT_SECRET"
          curl_headers=(
            -H "CF-Access-Client-Id: $PRODUCTION_CF_ACCESS_CLIENT_ID"
            -H "CF-Access-Client-Secret: $PRODUCTION_CF_ACCESS_CLIENT_SECRET"
          )
          for service_url in "$PRODUCTION_CHARGE_GENERATOR_URL" "$PRODUCTION_PAYMENT_BOT_URL"; do
            body="$(curl --fail --silent --show-error "${curl_headers[@]}" "$service_url/health")"
            node -e '
              const body = process.argv[1];
              let parsed;
              try {
                parsed = JSON.parse(body);
              } catch {
                console.error(`Expected JSON from ${process.argv[2]}, received: ${body.slice(0, 160)}`);
                process.exit(1);
              }
              if (parsed.ok !== true) {
                console.error(`Health check failed for ${process.argv[2]}: ${body}`);
                process.exit(1);
              }
            ' "$body" "$service_url"
          done
      - name: Verify production Telegram webhook
        env:
          PRODUCTION_PAYMENT_BOT_URL: ${{ vars.PRODUCTION_PAYMENT_BOT_URL }}
          PRODUCTION_TELEGRAM_BOT_TOKEN: ${{ secrets.PRODUCTION_TELEGRAM_BOT_TOKEN }}
        run: |
          info="$(curl --fail --silent --show-error "https://api.telegram.org/bot${PRODUCTION_TELEGRAM_BOT_TOKEN}/getWebhookInfo")"
          node -e '
            const info = JSON.parse(process.argv[1]);
            const expected = process.argv[2];
            if (info.ok !== true || info.result?.url !== expected) {
              console.error(JSON.stringify(info, null, 2));
              process.exit(1);
            }
          ' "$info" "$PRODUCTION_PAYMENT_BOT_URL"
